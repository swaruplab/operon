name: Docs site

on:
  push:
    branches: [cross-platform]
    paths:
      - 'docs-site/**'
      - 'docs/img/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material==9.7.6 pymdown-extensions

      - name: Resolve symlinked images
        # The docs-site/docs/img symlink → ../../docs/img isn't followed by
        # default in CI runners. Resolve it before build.
        run: |
          rm -f docs-site/docs/img
          cp -R docs/img docs-site/docs/img

      - name: Build site
        working-directory: docs-site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
